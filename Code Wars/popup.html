<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup with Input Fields</title>
    <style>
        /* Basic styling for the page */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }

        /* The Modal (background) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0, 0, 0, 0.4); /* Black with transparency */
        }

        /* Modal Content */
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        /* The Close Button */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        /* Button to open the modal */
        .open-modal-btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .open-modal-btn:hover {
            background-color: #45a049;
        }

        /* Form input fields */
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Submit button inside the modal */
        .submit-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- Button to Open the Modal -->
    <button class="open-modal-btn" onclick="openModal()">Open Popup</button>

    <!-- The Modal -->
    <div id="myModal" class="modal">
        <!-- Modal content -->
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Popup with Input Fields</h2>

            <!-- Form with two input fields -->
            <form id="popupForm">
                <div>
                    <label for="input1">Input 1:</label>
                    <input type="text" id="input1" name="input1" placeholder="Enter first value">
                </div>

                <div>
                    <label for="input2">Input 2:</label>
                    <input type="text" id="input2" name="input2" placeholder="Enter second value">
                </div>

                <!-- Submit Button -->
                <button type="button" class="submit-btn" onclick="submitForm()">Submit</button>
            </form>
        </div>
    </div>

    <script>
        // Get the modal and close button
        const modal = document.getElementById("myModal");
        const closeButton = document.querySelector(".close");

        // Function to open the modal
        function openModal() {
            modal.style.display = "block"; // Show the modal
        }

        // Function to close the modal
        function closeModal() {
            modal.style.display = "none"; // Hide the modal
        }

        // Close the modal if the user clicks anywhere outside of the modal content
        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        // Function to handle form submission
        function submitForm() {
            const input1 = document.getElementById("input1").value;
            const input2 = document.getElementById("input2").value;

            if (input1 && input2) {
                // Display an alert with the form data (this can be replaced with more complex logic)
                alert(`Form Submitted!\nInput 1: ${input1}\nInput 2: ${input2}`);
                
                // Close the modal after submitting the form
                closeModal();
            } else {
                alert("Please fill in both input fields.");
            }
        }
    </script>

</body>
</html>
